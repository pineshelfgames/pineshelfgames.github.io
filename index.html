  <meta property="og:title" content="Pine Shelf Games">
  <meta property="og:description" content="Small indie studio making cozy games. Now working on Tiny Farmer Island.">

  <style>
    @font-face {
      font-family: "Alegreya SC";
      src: url("fonts/AlegreyaSC-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --navy: #12264a;
      --navy-deep: #0c1b36;
      --card: #1a3260;
      --card-hover: #22407a;
      --cream: #fff1dc;
      --cream-dim: #c9bfae;
      --orange: #ff8b1f;
      --orange-soft: #ffa94d;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(ellipse at 50% 0%, #1b3566 0%, var(--navy) 45%, var(--navy-deep) 100%) fixed;
      background-color: var(--navy);
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px 32px;
    }

    main {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      width: 148px;
      height: 148px;
      display: block;
    }

    h1 {
      font-family: "Alegreya SC", Georgia, serif;
      font-weight: 700;
      font-size: 2.4rem;
      line-height: 1.1;
      margin: 18px 0 0;
      letter-spacing: 0.01em;
    }

    .rule {
      width: 64%;
      height: 2px;
      background: var(--orange);
      border: 0;
      margin: 14px auto;
    }

    .tagline {
      margin: 0;
      font-size: 1.05rem;
      color: var(--cream-dim);
    }

    .now {
      font-family: "Alegreya SC", Georgia, serif;
      font-weight: 700;
      color: var(--orange-soft);
      font-size: 1.1rem;
      margin: 6px 0 0;
    }

    .links {
      list-style: none;
      padding: 0;
      margin: 32px 0 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid rgba(255, 241, 220, 0.12);
      color: var(--cream);
      text-decoration: none;
      text-align: left;
      transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    .links a:hover {
      background: var(--card-hover);
      border-color: rgba(255, 139, 31, 0.6);
      transform: translateY(-1px);
    }

    .links a:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }

    .links svg {
      width: 22px;
      height: 22px;
      flex: none;
      fill: currentColor;
    }

    .label {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .label strong {
      font-family: "Alegreya SC", Georgia, serif;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .label span {
      font-size: 0.9rem;
      color: var(--cream-dim);
    }

    .links a.primary {
      background: var(--orange);
      border-color: var(--orange);
      color: var(--navy-deep);
    }

    .links a.primary .label span { color: rgba(12, 27, 54, 0.75); }

    .links a.primary:hover {
      background: var(--orange-soft);
      border-color: var(--orange-soft);
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: rgba(255, 241, 220, 0.45);
    }
  </style>
